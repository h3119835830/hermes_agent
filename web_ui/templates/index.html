<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hermes Agent — AI 助手</title>
  <meta name="description" content="基于 Hermes Agent + DeepSeek 的智能 AI 助手，支持流式对话、文件上传与记忆面板。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" />
  <link rel="stylesheet" href="/static/style.css?v=7" />
  <style>
    /* 强制覆盖气泡框宽度，绕过任何缓存 */
    .message.user      { max-width: 420px !important; }
    .message.assistant { max-width: 560px !important; }
    .bubble { padding: 8px 12px !important; font-size: 13px !important; line-height: 1.5 !important; }
  </style>
</head>
<body class="theme-gold">

<!-- ── Header ─────────────────────────────────────────────────────────── -->
<header id="main-header">
  <div class="header-left">
    <span class="logo-icon">⚕</span>
    <span class="logo-text">Hermes Agent</span>
  </div>

  <div class="header-center">
    <span class="status-dot" id="status-dot"></span>
    <span class="status-text" id="status-text">连接中…</span>
    <span class="model-badge">DeepSeek</span>
  </div>

  <div class="header-right">
    <!-- Token usage display -->
    <div class="token-box" id="token-box" title="本次会话累计消耗 Token 数">
      <span class="token-icon">⚡</span>
      <span id="token-count">0</span>
      <span class="token-label">tokens</span>
    </div>
    <div class="theme-switcher" role="group" aria-label="主题切换">
      <button class="theme-btn active" id="theme-gold" data-theme="gold" title="深空黑金">🏆</button>
      <button class="theme-btn"        id="theme-neon"  data-theme="neon"  title="赛博霓虹">⚡</button>
      <button class="theme-btn"        id="theme-aurora" data-theme="aurora" title="极光磨砂">🌌</button>
    </div>
  </div>
</header>

<!-- ── Main Layout ─────────────────────────────────────────────────────── -->
<main id="main-layout">

  <!-- Left: Session Sidebar -->
  <aside id="session-sidebar">
    <button id="new-session-btn" class="new-session-btn">
      <span>＋</span> 新建会话
    </button>
    <div class="sidebar-label">历史会话</div>
    <div id="session-list" role="list"></div>

    <!-- 更多会话省略号按钮 -->
    <button id="more-sessions-btn" class="more-sessions-btn hidden" title="查看更多历史会话">
      ··· 更多会话
    </button>

    <!-- 更多会话弹出小框 -->
    <div id="more-sessions-popup" class="more-sessions-popup hidden">
      <div class="more-sessions-header">
        <span>历史会话</span>
        <button id="close-more-sessions" class="close-popup-btn">✕</button>
      </div>
      <div id="more-sessions-list"></div>
    </div>

    <!-- 左下角使用日志按钮 -->
    <div class="sidebar-footer">
      <button id="usage-log-btn" class="usage-log-btn" title="查看模型使用记录">
        📊 使用日志
      </button>
    </div>
  </aside>

  <!-- 使用日志弹框 -->
  <div id="usage-log-modal" class="usage-log-overlay hidden">
    <div class="usage-log-box">
      <div class="usage-log-header">
        <span>📊 模型使用日志</span>
        <button id="close-usage-log" class="close-popup-btn">✕</button>
      </div>
      <div class="usage-log-body">
        <table class="usage-table">
          <thead>
            <tr>
              <th>时间</th>
              <th>模型</th>
              <th>用时</th>
              <th>首字</th>
              <th>输入</th>
              <th>输出</th>
              <th>流式</th>
            </tr>
          </thead>
          <tbody id="usage-log-tbody">
            <tr><td colspan="7" class="log-empty">暂无记录</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>


  <!-- Center: Chat -->
  <section id="chat-panel">
    <div id="messages-container" role="log" aria-live="polite">
      <!-- Welcome state -->
      <div id="welcome-screen">
        <div class="welcome-icon">⚕</div>
        <h1 class="welcome-title">Hermes Agent</h1>
        <p class="welcome-sub">由 DeepSeek 驱动 · 支持文件上传 · 自动生成记忆</p>
        <div class="welcome-tips">
          <div class="tip-card">💬 发送任意消息开始对话</div>
          <div class="tip-card">📎 点击附件按钮上传文件</div>
          <div class="tip-card">🧠 右侧面板查看 Agent 记忆</div>
        </div>
      </div>
    </div>

    <!-- Attachment preview -->
    <div id="attachment-preview" class="attachment-preview hidden">
      <span class="attach-name" id="attach-name"></span>
      <button id="attach-remove" class="attach-remove" title="移除附件">✕</button>
    </div>

    <!-- Input toolbar -->
    <div class="input-toolbar">
      <label class="toggle-switch" title="开启/关闭联网搜索">
        <input type="checkbox" id="web-search-toggle">
        <span class="slider"></span>
        <span class="toggle-text">🌐 联网搜索</span>
      </label>
      <label class="toggle-switch" title="开启/关闭深度思考（如果模型支持）">
        <input type="checkbox" id="deep-thinking-toggle" checked>
        <span class="slider"></span>
        <span class="toggle-text">🧠 深度思考</span>
      </label>
    </div>

    <!-- Input area -->
    <div id="input-area">
      <label for="file-input" class="attach-btn" id="attach-btn" title="上传文件 / 图片">
        📎
        <input type="file" id="file-input" accept="*/*" hidden />
      </label>
      <textarea
        id="message-input"
        placeholder="输入消息…（Shift+Enter 换行，Enter 发送）"
        rows="1"
        aria-label="消息输入框"
      ></textarea>
      <button id="stop-btn" class="send-btn stop-btn" aria-label="中断生成" style="display: none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="6" y="6" width="12" height="12"></rect>
        </svg>
      </button>
      <button id="send-btn" class="send-btn" aria-label="发送消息">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
  </section>

  <!-- Right: Memory Panel -->
  <aside id="memory-panel">
    <div class="memory-header">
      <span class="memory-icon">🧠</span>
      <span>记忆面板</span>
      <span class="memory-badge" id="memory-badge">实时</span>
    </div>

    <div class="memory-tabs">
      <button class="mem-tab active" data-tab="MEMORY.md" id="tab-memory">通用记忆</button>
      <button class="mem-tab" data-tab="USER.md" id="tab-user">用户画像</button>
    </div>

    <div id="memory-content" class="memory-content">
      <div class="memory-empty">
        <div class="memory-empty-icon">💭</div>
        <p>记忆尚未生成</p>
        <p class="memory-empty-sub">对话几轮后，Agent 会自动在这里记录重要信息</p>
      </div>
    </div>
  </aside>

</main>

<!-- Thinking indicator template (cloned via JS) -->
<template id="thinking-tpl">
  <div class="message assistant thinking" id="thinking-indicator">
    <div class="avatar">⚕</div>
    <div class="bubble">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      <span class="thinking-status"></span>
    </div>
  </div>
</template>
<!-- Approval Modal -->
<div id="approval-modal" class="modal-overlay hidden">
  <div class="modal-content">
    <div class="modal-header">
      <span class="modal-icon">⚠️</span>
      <h2>敏感操作确认</h2>
    </div>
    <div class="modal-body">
      <p>Hermes Agent 试图执行可能带有危险性的终端操作，请确认是否允许：</p>
      <div class="command-box">
        <code id="approval-command">rm -rf /</code>
      </div>
      <p class="command-desc" id="approval-desc">描述信息</p>
    </div>
    <div class="modal-footer">
      <button id="btn-deny" class="btn-deny">拒绝 (Deny)</button>
      <button id="btn-approve" class="btn-approve">允许 (Approve)</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="/static/app.js?v=6"></script>
</body>
</html>
